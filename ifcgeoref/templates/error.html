<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} · IFC Georeferencing</title>
  <link rel="icon" href="{{ asset('img/favicon.png') }}">
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>

    <a class="btn primary" href="/">Go to IFC Georeferencing</a>
  </div>
</body>
</html>
